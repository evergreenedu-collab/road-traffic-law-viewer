name: Pages 배포 (Actions 모드)

# legacy Jekyll 빌드가 큰 web_data 폴더로 계속 errored — Actions 모드로 우회.
# master push마다 실행 + 수동 dispatch.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (한 번에 하나만)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      # PR-H9: viewer JS 스모크 테스트 — brace mismatch·syntax 회귀 차단
      # 실패 시 Pages 배포 차단 (사용자에게 깨진 viewer 도달 방지)
      - name: Node.js 설정 (smoke test용)
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: jsdom 설치
        run: npm install --no-save jsdom

      - name: viewer JS 스모크 테스트
        run: |
          node tests/smoke_viewer.js \
            viewer.html \
            viewer_tlspc.html \
            viewer_tkga.html \
            viewer_car_mgmt.html \
            viewer_passenger_transport.html \
            viewer_cargo_transport.html \
            viewer_crim_proc.html

      - name: Pages 환경 설정
        uses: actions/configure-pages@v6

      - name: Artifact 업로드 (전체 repo, .nojekyll 포함)
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
