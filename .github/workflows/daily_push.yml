name: 매일 카드 + 푸시 알림

# 평일(월~금) 06:00 KST = 21:00 UTC (전날) — 도착 평균 07:00 이후 안정 목표
# 2026-06-02 사용자 보고: 도착 편차 06:30~07:30이라 20분 늦춤 → 07:00 이후로 평균 이동
on:
  schedule:
    - cron: '0 21 * * 0-4'    # UTC 일·월·화·수·목 21:00 = KST 월·화·수·목·금 06:00
  workflow_dispatch:           # 수동 트리거 (PR-H3 테스트용)

permissions:
  contents: write              # 카드 자료 commit·push 위해 필요
  actions: write               # deploy_pages workflow_dispatch 트리거 위해 필요 (github-actions[bot] push가 자동 재trigger 안 되는 정책 우회)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      # update.yml(주1회 월요일)이 만들어둔 data/ 캐시를 read-only로 복원.
      # 거대 article_history_*.json(car_mgmt 169MB 등)·three_tier 다른 그룹 자료까지 환경에서 사용 가능.
      # 캐시 miss 시 graceful — git에 트래킹된 three_tier 7개 + history tlspc·tkga만으로 부분 동작.
      - name: data/ 캐시 복원 (update.yml 빌드 결과)
        uses: actions/cache/restore@v5
        with:
          path: data
          key: law-history-daily-restore-only-${{ github.run_id }}
          restore-keys: |
            law-history-data-v2-

      - name: 캐시 상태 출력
        run: |
          if [ -d data ] && [ -n "$(ls -A data 2>/dev/null)" ]; then
            echo "📚 캐시 복원 성공 ($(ls data/*.json 2>/dev/null | wc -l)개 JSON)"
          else
            echo "📭 캐시 miss — git 트래킹 자료(three_tier 7개 + history tlspc·tkga)로만 진행"
          fi

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: requirements 설치
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Node 설정 (web-push)
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: web-push 설치
        run: npm install --no-save web-push

      - name: KST 오늘 날짜 산정
        id: date
        run: |
          # GitHub Actions runner는 UTC. KST = UTC + 9h.
          # 21:00 UTC 실행 시 KST 다음날 06:00 — 다음날을 "오늘" 날짜로
          KST_TODAY=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          KST_DOW=$(TZ='Asia/Seoul' date +%u)   # 1=월 ~ 7=일
          echo "today=$KST_TODAY" >> $GITHUB_OUTPUT
          echo "dow=$KST_DOW" >> $GITHUB_OUTPUT
          echo "KST 오늘=$KST_TODAY (요일=$KST_DOW)"

      - name: 평일만 진행 (주말 스킵)
        if: steps.date.outputs.dow == '6' || steps.date.outputs.dow == '7'
        run: |
          echo "주말이라 스킵"
          exit 0

      - name: 그날 카드 1장 빌드
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd tutor
          python build_tutor_content.py --date ${{ steps.date.outputs.today }} --days 1

      - name: daily_index.json 갱신 (달력 UI용 카드 있는 날 인덱스)
        run: |
          python -c "
          import json, glob, re, pathlib
          dates = sorted(set(
              m.group(1) for f in glob.glob('tutor/data/daily_*.json')
              for m in [re.search(r'daily_(\d{4}-\d{2}-\d{2})\.json$', f)] if m
          ))
          pathlib.Path('tutor/data/daily_index.json').write_text(
              json.dumps({'dates': dates, 'count': len(dates)}, ensure_ascii=False),
              encoding='utf-8'
          )
          print(f'daily_index.json: {len(dates)} entries')
          "

      - name: 카드 자료 commit·push (master)
        id: card_commit
        continue-on-error: true   # push race로 rejected돼도 알림 발송은 계속 진행
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tutor/data/daily_*.json tutor/data/schedule.json tutor/data/daily_index.json
          if git diff --cached --quiet; then
            echo "변경 없음 — commit 스킵"
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "data: ${{ steps.date.outputs.today }} 카드 자동 빌드"
          # PR 머지·재trigger와 race 회피 — rebase 후 push, 그래도 실패하면 무시
          git pull --rebase origin master || true
          if git push origin master; then
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ push 실패 — race condition. 알림 발송은 계속 진행"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Pages 배포 트리거 (github-actions[bot] push는 자동 재trigger 안 됨)
        if: steps.card_commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy_pages.yml --ref master
          echo "✅ deploy_pages workflow_dispatch 트리거 완료"

      - name: 푸시 알림 발송 (Phase 5 — 다중 사용자)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: BB5tBlvRBOMhfWHazK68THkT2t5oQo7S2SBKP7WsT1TmHWikV_gIukOlfkDGoLiy5Gb6TlN-HJ7osXVjEOzoRBM
          PUSH_API_URL: https://road-traffic-law-viewer.vercel.app/api/subscribe
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TODAY: ${{ steps.date.outputs.today }}
          DOW: ${{ steps.date.outputs.dow }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const webpush = require('web-push');

          webpush.setVapidDetails(
            process.env.VAPID_SUBJECT,
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY,
          );

          // 그날 카드에서 oneliner·법령명·조문번호 추출
          const today = process.env.TODAY;
          const dow = parseInt(process.env.DOW, 10);    // 1=월 ~ 5=금
          const cardPath = `tutor/data/daily_${today}.json`;
          const dowLabel = ['월','화','수','목','금'][dow - 1] || '';
          let title = `🚗 ${today.slice(5)} (${dowLabel}) 출근길 법령튜터`;
          let body = '오늘의 카드가 준비됐어요.';
          let url = `/road-traffic-law-viewer/tutor/?date=${today}`;

          try {
            const daily = JSON.parse(fs.readFileSync(cardPath, 'utf-8'));
            const card = (daily.cards || [])[0];
            if (card) {
              const group = card.group || 'road';
              const colorMap = {
                road: '🟦', tlspc: '🟩', tkga: '🟪',
                car_mgmt: '🟪', passenger_transport: '🟪', cargo_transport: '🟪', crim_proc: '🟪',
              };
              const color = colorMap[group] || '🟦';
              const li = card.law_info || {};
              const lawName = li['법령명'] || '도로교통법';
              const jo = li['매핑법률조문'] || '?';
              const joTitle = li['매핑법률조문제목'] || '';
              const oneliner = ((card.learning_content || {}).oneliner || '').trim();
              const onelinerShort = oneliner.length > 90 ? oneliner.slice(0, 90) + '…' : oneliner;
              body = `${color} ${lawName} 제${jo}조 ${joTitle}` + (onelinerShort ? `\n${onelinerShort}` : '');
            }
          } catch (e) {
            console.error('카드 읽기 실패:', e.message);
          }

          const payload = JSON.stringify({ title, body, url });
          console.log('payload size:', payload.length, 'bytes');

          // 200명+ 환경용 worker pool 설정
          const CHUNK_SIZE = 10;          // 한 번에 동시 발송할 endpoint 수 (FCM 429 회피)
          const CHUNK_DELAY_MS = 100;     // 청크 사이 짧은 텀 (부하 분산)
          const MAX_RETRY_AFTER_MS = 5000;// 429 응답 시 최대 대기 시간

          (async () => {
            // 1. Vercel API에서 구독자 리스트 조회 (Bearer 인증)
            const apiUrl = process.env.PUSH_API_URL;
            if (!apiUrl || !process.env.ADMIN_TOKEN) {
              console.log('PUSH_API_URL 또는 ADMIN_TOKEN 미설정 — 발송 건너뜀.');
              process.exit(0);
            }
            let subscriptions = [];
            try {
              const res = await fetch(apiUrl, {
                headers: { Authorization: `Bearer ${process.env.ADMIN_TOKEN}` },
              });
              if (!res.ok) {
                console.error('Vercel API 응답 실패:', res.status, await res.text());
                process.exit(1);
              }
              const data = await res.json();
              subscriptions = Array.isArray(data.subscriptions) ? data.subscriptions : [];
            } catch (e) {
              console.error('Vercel API 호출 실패:', e.message);
              process.exit(1);
            }

            if (subscriptions.length === 0) {
              console.log('구독자 없음 — 발송 건너뜀 (정상 종료).');
              process.exit(0);
            }
            console.log(`구독자 ${subscriptions.length}명에게 발송 시도 (청크 ${CHUNK_SIZE}개)`);

            // 2. Worker pool 다중 발송 — 청크 단위 순차, 청크 내 동시
            const allResults = [];
            for (let i = 0; i < subscriptions.length; i += CHUNK_SIZE) {
              const chunk = subscriptions.slice(i, i + CHUNK_SIZE);
              const chunkResults = await Promise.allSettled(chunk.map(sub =>
                webpush.sendNotification(sub, payload, {
                  TTL: 86400, urgency: 'high', headers: { Urgency: 'high' },
                })
              ));
              allResults.push(...chunkResults);

              // 429 (Too Many Requests) 받았으면 Retry-After 헤더 존중
              const r429 = chunkResults.find(r => r.status === 'rejected' && r.reason?.statusCode === 429);
              if (r429) {
                const retryAfter = parseInt(r429.reason?.headers?.['retry-after'] || '1', 10);
                const waitMs = Math.min(retryAfter * 1000, MAX_RETRY_AFTER_MS);
                console.log(`청크 ${Math.floor(i / CHUNK_SIZE) + 1}: 429 응답. ${waitMs}ms 대기 후 다음 청크.`);
                await new Promise(r => setTimeout(r, waitMs));
              } else if (i + CHUNK_SIZE < subscriptions.length) {
                await new Promise(r => setTimeout(r, CHUNK_DELAY_MS));
              }
            }

            // 3. 결과 집계 + 404/410 stale endpoint 자동 정리 (recordId 일치 시만)
            let ok = 0, fail = 0;
            const stalePromises = [];
            for (let i = 0; i < allResults.length; i++) {
              const r = allResults[i];
              const sub = subscriptions[i];
              const host = (() => { try { return new URL(sub.endpoint).host; } catch (_) { return '?'; } })();
              if (r.status === 'fulfilled') {
                ok++;
                console.log(`OK [${host}] ${r.value.statusCode}`);
              } else {
                fail++;
                const code = r.reason?.statusCode;
                console.log(`FAIL [${host}] ${code} ${r.reason?.message || ''}`);
                // 404·410 stale 자동 정리 — recordId 함께 보내 race condition 차단
                if (code === 404 || code === 410) {
                  stalePromises.push(
                    fetch(apiUrl, {
                      method: 'DELETE',
                      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${process.env.ADMIN_TOKEN}` },
                      body: JSON.stringify({ endpoint: sub.endpoint, recordId: sub.recordId }),
                    }).then(res => {
                      if (res.ok) console.log(`stale 정리: ${host}`);
                      else if (res.status === 409) console.log(`stale 스킵 (record 갱신됨): ${host}`);
                      else console.warn(`stale 정리 실패: ${host} status=${res.status}`);
                    }).catch(e => console.warn(`stale 정리 네트워크 실패: ${host}`, e.message))
                  );
                }
              }
            }
            if (stalePromises.length) await Promise.allSettled(stalePromises);

            console.log(`==SUMMARY== 성공 ${ok} / 실패 ${fail} / 총 ${allResults.length}`);
            if (ok === 0 && fail > 0) process.exit(1);
          })().catch(e => { console.error('치명 에러:', e); process.exit(1); });
          EOF
