name: 매일 카드 + 푸시 알림

# 평일(월~금) 06:00 KST = 21:00 UTC (전날) — 도착 평균 07:00 이후 안정 목표
# 2026-06-02 사용자 보고: 도착 편차 06:30~07:30이라 20분 늦춤 → 07:00 이후로 평균 이동
on:
  schedule:
    # 2026-06-05: GitHub Actions 예약 cron이 매일 36~122분 늦게 발사돼 도착이 06:36~08:02 KST로 불안정.
    # 의도 시각을 앞당기고 혼잡한 정각(:00)을 피해(:35) 지연을 흡수 → 도착 ~05:11~06:37 KST.
    - cron: '35 19 * * 0-4'    # UTC 일~목 19:35 = KST 월~금 04:35 (지연 감안 ~06:00 전후 도착)
  workflow_dispatch:           # 수동 트리거 (PR-H3 테스트용 + 과거 날짜 재생성)
    inputs:
      date:
        description: '복구할 날짜 YYYY-MM-DD (실패·누락 카드만 재생성 — 성공 카드는 멱등 스킵. 알림 발송 안 함)'
        required: false
        default: ''
        type: string

permissions:
  contents: write              # 카드 자료 commit·push 위해 필요
  actions: write               # deploy_pages workflow_dispatch 트리거 위해 필요 (github-actions[bot] push가 자동 재trigger 안 되는 정책 우회)
  issues: write                # 카드 발행 보류 알림 Issue (2026-10-10 — 조용한 실패 방지)

# 이중 트리거(GitHub schedule + Vercel cron→dispatch) 동시 실행 직렬화 —
# 두 실행이 같은 날 카드를 각자 생성해 서로 덮어쓰는 race 차단 (2026-10-10 교차검증:
# 운영 98일 중 61일 이중 생성). 뒤 실행은 앞 실행 커밋을 pull한 뒤 멱등 스킵.
concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      # update.yml(주1회 월요일)이 만들어둔 data/ 캐시를 read-only로 복원.
      # 거대 article_history_*.json(car_mgmt 169MB 등)·three_tier 다른 그룹 자료까지 환경에서 사용 가능.
      # 캐시 miss 시 graceful — git에 트래킹된 three_tier 7개 + history tlspc·tkga만으로 부분 동작.
      - name: data/ 캐시 복원 (update.yml 빌드 결과)
        uses: actions/cache/restore@v5
        with:
          path: data
          key: law-history-daily-restore-only-${{ github.run_id }}
          restore-keys: |
            law-history-data-v2-

      - name: 캐시 상태 출력
        run: |
          if [ -d data ] && [ -n "$(ls -A data 2>/dev/null)" ]; then
            echo "📚 캐시 복원 성공 ($(ls data/*.json 2>/dev/null | wc -l)개 JSON)"
          else
            echo "📭 캐시 miss — git 트래킹 자료(three_tier 7개 + history tlspc·tkga)로만 진행"
          fi

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: requirements 설치
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Node 설정 (web-push)
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: web-push 설치
        run: npm install --no-save web-push

      - name: KST 오늘 날짜 산정
        id: date
        run: |
          # GitHub Actions runner는 UTC. KST = UTC + 9h.
          # 21:00 UTC 실행 시 KST 다음날 06:00 — 다음날을 "오늘" 날짜로
          # 2026-10-10: workflow_dispatch date 입력 시 그 날짜로 재생성 (과거 실패 카드 복구용)
          if [ -n "${{ inputs.date }}" ]; then
            KST_TODAY="${{ inputs.date }}"
          else
            KST_TODAY=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          fi
          KST_DOW=$(TZ='Asia/Seoul' date -d "$KST_TODAY" +%u)   # 1=월 ~ 7=일
          echo "today=$KST_TODAY" >> $GITHUB_OUTPUT
          echo "dow=$KST_DOW" >> $GITHUB_OUTPUT
          echo "KST 기준일=$KST_TODAY (요일=$KST_DOW)"

      - name: 평일만 진행 (주말 스킵)
        if: steps.date.outputs.dow == '6' || steps.date.outputs.dow == '7'
        run: |
          echo "주말이라 스킵"
          exit 0

      - name: 그날 카드 1장 빌드
        # 주말 가드 — 위 '평일만 진행' 단계의 exit 0은 그 단계만 끝낼 뿐이라(교차검증 #9),
        # 주말 수동 dispatch 시 카드 없이 기본 문구 알림이 나가는 것을 단계 조건으로 차단
        if: steps.date.outputs.dow != '6' && steps.date.outputs.dow != '7'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          cd tutor
          python build_tutor_content.py --date ${{ steps.date.outputs.today }} --days 1

      - name: daily_index.json 갱신 (달력 UI용 카드 있는 날 인덱스)
        run: |
          python -c "
          import json, glob, re, pathlib
          # 달력 UI용 — 카드 있는 날 목록(dates) + 날짜별 실제 주제(meta).
          # meta[date] = SUBJECTS 키(road_article/road_case/tlspc/tkga/car_mgmt/...).
          # cards[0]가 그 날의 메인 카드. 정보 없으면 meta 생략 → 프런트가 요일 규칙으로 예측.
          def subject_key(card):
              if not card:
                  return None
              if card.get('card_type') == 'case':
                  return 'road_case'
              if card.get('card_type') == 'sub_laws':
                  return 'road_sub'
              g = card.get('group')
              if not g:
                  return None
              return 'road_article' if g == 'road' else g
          dates, meta = [], {}
          for f in sorted(glob.glob('tutor/data/daily_*.json')):
              m = re.search(r'daily_(\d{4}-\d{2}-\d{2})\.json$', f)
              if not m:
                  continue
              d = m.group(1)
              dates.append(d)
              try:
                  data = json.loads(pathlib.Path(f).read_text(encoding='utf-8'))
                  cards = data.get('cards') or []
                  sk = subject_key(cards[0]) if cards else None
                  if sk:
                      meta[d] = sk
              except Exception:
                  pass
          dates = sorted(set(dates))
          pathlib.Path('tutor/data/daily_index.json').write_text(
              json.dumps({'dates': dates, 'count': len(dates), 'meta': meta}, ensure_ascii=False),
              encoding='utf-8'
          )
          print(f'daily_index.json: {len(dates)} entries, {len(meta)} meta')
          "

      - name: 카드 자료 commit·push (master)
        id: card_commit
        continue-on-error: true   # push race로 rejected돼도 알림 발송은 계속 진행
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tutor/data/daily_*.json tutor/data/schedule.json tutor/data/daily_index.json
          if git diff --cached --quiet; then
            echo "변경 없음 — commit 스킵"
            echo "pushed=false" >> $GITHUB_OUTPUT
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "data: ${{ steps.date.outputs.today }} 카드 자동 빌드"
          echo "committed=true" >> $GITHUB_OUTPUT
          # PR 머지·재trigger와 race 회피 — rebase 후 push, 그래도 실패하면 무시
          git pull --rebase origin master || true
          if git push origin master; then
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ push 실패 — race condition. 알림 발송은 계속 진행"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Pages 배포 트리거 (github-actions[bot] push는 자동 재trigger 안 됨)
        if: steps.card_commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy_pages.yml --ref master
          echo "✅ deploy_pages workflow_dispatch 트리거 완료"

      # 2026-10-10 사용자 지시 "이런 일이 반복되지 않도록" — 발행 보류가 조용히 지나가지 않게.
      # 그날 카드가 발행 허용 상태가 아니면 날짜별 Issue 생성(이미 있으면 댓글), 이후
      # 재시도가 성공하면 그 Issue를 자동 닫음. (8/25·9/23처럼 반복 차단되는 날 즉시 인지)
      # 과거 날짜 재생성(dispatch date 입력)도 포함 — 복구 실패 역시 알려야 할 실패다.
      # always(): 앞 단계가 터져도 감시는 실행 (조용한 실패 방지의 핵심 — Codex 검증 반영)
      - name: 발행 보류 감시 (Issue 알림)
        if: always() && steps.date.outputs.dow != '6' && steps.date.outputs.dow != '7' && steps.date.outputs.today != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          STATUS=$(python - <<'EOF'
          import json, os
          try:
              d = json.load(open(f"tutor/data/daily_{os.environ['TODAY']}.json", encoding="utf-8"))
              c = (d.get("cards") or [{}])[0]
              st = c.get("llm_status")
              print("ok" if st in ("ok", "ok_re_paired", "ok_partial") else f"hold:{st}")
          except Exception:
              print("hold:no_card")
          EOF
          )
          TITLE="[카드 발행 보류] $TODAY"
          # 닫힌 Issue 재보류 대비 — state all에서 찾고, 닫혀 있으면 reopen (중복 생성 방지)
          read -r NUM STATE <<< "$(gh issue list --state all --search "in:title $TODAY" --json number,title,state \
                --jq "[.[] | select(.title == \"$TITLE\")][0] | \"\(.number) \(.state)\"" 2>/dev/null || echo '')"
          [ "$NUM" = "null" ] && NUM=""
          if [ "$STATUS" = "ok" ]; then
            if [ -n "$NUM" ] && [ "$STATE" = "OPEN" ]; then
              if gh issue close "$NUM" --comment "✅ 재시도에서 카드 정상 발행 — 자동 종료"; then
                echo "보류 Issue #$NUM 자동 닫음"
              else
                echo "⚠️ Issue 닫기 실패 (#$NUM) — 수동 확인"
              fi
            else
              echo "카드 정상 — 알림 불필요"
            fi
          else
            BODY="$TODAY 카드가 발행 보류 상태입니다 (사유: ${STATUS#hold:}).
          - AI 해설 생성 실패 시 발행하지 않는 정책(2026-10-10)에 따라 저장·알림이 생략됐습니다.
          - 같은 날 다음 트리거가 자동 재시도합니다. 이 Issue가 닫히지 않고 남아 있으면 그날 재시도도 실패한 것입니다.
          - 수동 재시도: Actions → '매일 카드 + 푸시 알림' → Run workflow (date=$TODAY)"
            if [ -n "$NUM" ]; then
              [ "$STATE" != "OPEN" ] && gh issue reopen "$NUM" 2>/dev/null
              if gh issue comment "$NUM" --body "재시도 실패 (사유: ${STATUS#hold:}, $(TZ=Asia/Seoul date '+%H:%M'))"; then
                echo "기존 Issue #$NUM 에 실패 댓글"
              else
                echo "⚠️ Issue 댓글 실패 (#$NUM)"
              fi
            else
              if gh issue create --title "$TITLE" --body "$BODY"; then
                echo "보류 Issue 생성: $TITLE"
              else
                echo "⚠️ Issue 생성 실패 — gh 권한·네트워크 확인"
              fi
            fi
          fi

      - name: 푸시 알림 발송 (Phase 5 — 다중 사용자)
        # 과거 날짜 재생성(inputs.date)은 알림 발송 안 함 — 당일 자동 실행만 발송
        if: steps.date.outputs.dow != '6' && steps.date.outputs.dow != '7' && inputs.date == ''
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: BB5tBlvRBOMhfWHazK68THkT2t5oQo7S2SBKP7WsT1TmHWikV_gIukOlfkDGoLiy5Gb6TlN-HJ7osXVjEOzoRBM
          PUSH_API_URL: https://road-traffic-law-viewer.vercel.app/api/subscribe
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TODAY: ${{ steps.date.outputs.today }}
          DOW: ${{ steps.date.outputs.dow }}
          COMMITTED: ${{ steps.card_commit.outputs.committed }}
          PUSHED: ${{ steps.card_commit.outputs.pushed }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const webpush = require('web-push');

          webpush.setVapidDetails(
            process.env.VAPID_SUBJECT,
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY,
          );

          // 그날 카드에서 oneliner·법령명·조문번호 추출
          const today = process.env.TODAY;
          const dow = parseInt(process.env.DOW, 10);    // 1=월 ~ 5=금
          const cardPath = `tutor/data/daily_${today}.json`;
          const dowLabel = ['월','화','수','목','금'][dow - 1] || '';
          let title = `🚗 ${today.slice(5)} (${dowLabel}) 출근길 법령튜터`;
          let body = '오늘의 카드가 준비됐어요.';
          let url = `/road-traffic-law-viewer/tutor/?date=${today}`;

          // 2026-10-10 발행 게이트(사용자 결정): AI 해설 있는 카드가 없으면 알림을 보내지 않는다.
          // 발행 보류된 날은 카드 파일 자체가 없음 — 다음 트리거 재시도에 맡김.
          const PUBLISH_OK = ['ok', 'ok_re_paired', 'ok_partial'];
          let daily, card;
          try {
            daily = JSON.parse(fs.readFileSync(cardPath, 'utf-8'));
            card = (daily.cards || [])[0];
          } catch (e) {
            console.log('오늘 카드 파일 없음/손상 — 알림 발송 안 함 (발행 게이트):', e.message);
            process.exit(0);
          }
          if (!card || !PUBLISH_OK.includes(card.llm_status)) {
            console.log(`AI 해설 미생성 카드(llm_status=${card && card.llm_status}) — 알림 발송 안 함`);
            process.exit(0);
          }
          // 신선도 가드 — 이번 빌드가 발행 보류돼도 디스크의 '예전 성공본'으로 알림이
          // 나가는 것 방지 (Codex 코드리뷰). generated_at은 runner(UTC) 로컬 시각이라
          // Date.parse와 기준 일치. 6시간 이내 생성본만 발송 (전날 카드 재발송 차단,
          // 당일 1차 실패 → 2차 재생성 복구 발송은 허용).
          const genAt = Date.parse(daily.generated_at || '');
          if (!genAt || (Date.now() - genAt) > 6 * 3600 * 1000) {
            console.log(`카드 생성 시각이 오래됨(generated_at=${daily.generated_at}) — 이번 실행 생성본 아님, 알림 발송 안 함`);
            process.exit(0);
          }
          {
            const group = card.group || 'road';
            const colorMap = {
              road: '🟦', tlspc: '🟩', tkga: '🟪',
              car_mgmt: '🟪', passenger_transport: '🟪', cargo_transport: '🟪', crim_proc: '🟪',
            };
            const color = colorMap[group] || '🟦';
            const li = card.law_info || {};
            const lawName = li['법령명'] || '도로교통법';
            const jo = li['매핑법률조문'] || '?';
            const joTitle = li['매핑법률조문제목'] || '';
            const oneliner = ((card.learning_content || {}).oneliner || '').trim();
            const onelinerShort = oneliner.length > 90 ? oneliner.slice(0, 90) + '…' : oneliner;
            body = `${color} ${lawName} 제${jo}조 ${joTitle}` + (onelinerShort ? `\n${onelinerShort}` : '');
          }

          // fail-open 정책 유지(사용자 결정 2026-10-10: 누락 < 중복) — 단, 새 카드를
          // 커밋했는데 push가 실패한 경우만 '저장 지연 가능' 안내를 덧붙인다.
          if (process.env.COMMITTED === 'true' && process.env.PUSHED !== 'true') {
            body += '\n(카드 반영이 지연될 수 있어요 — 어제 카드가 보이면 잠시 후 다시 열어주세요)';
          }

          const payload = JSON.stringify({ title, body, url });
          console.log('payload size:', payload.length, 'bytes');

          // 200명+ 환경용 worker pool 설정
          const CHUNK_SIZE = 10;          // 한 번에 동시 발송할 endpoint 수 (FCM 429 회피)
          const CHUNK_DELAY_MS = 100;     // 청크 사이 짧은 텀 (부하 분산)
          const MAX_RETRY_AFTER_MS = 5000;// 429 응답 시 최대 대기 시간

          (async () => {
            // 1. Vercel API에서 구독자 리스트 조회 (Bearer 인증)
            const apiUrl = process.env.PUSH_API_URL;
            if (!apiUrl || !process.env.ADMIN_TOKEN) {
              console.log('PUSH_API_URL 또는 ADMIN_TOKEN 미설정 — 발송 건너뜀.');
              process.exit(0);
            }
            // 0. 멱등성 — 오늘(KST) 이미 발송했으면 스킵 (Vercel cron→dispatch + GitHub schedule 이중 트리거 중복 방지).
            //    명시적 {send:false}일 때만 스킵. 그 외 오류·5xx·네트워크 실패는 발송 진행(누락 < 중복, "무조건 발송" 우선).
            const claimUrl = apiUrl.replace(/\/subscribe(\?.*)?$/, '/claim');
            try {
              const cr = await fetch(`${claimUrl}?token=${encodeURIComponent(process.env.ADMIN_TOKEN)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${process.env.ADMIN_TOKEN}` },
                body: JSON.stringify({ date: today, phase: 'acquire' }),
              });
              const cj = await cr.json().catch(() => ({}));
              if (cj && cj.send === false) {
                console.log(`멱등성: 오늘(${today}) 이미 발송/진행 중 (${cj.reason}) — 발송 스킵`);
                process.exit(0);
              }
              console.log(`멱등성 claim 획득 (${today}) — 발송 진행`);
            } catch (e) {
              console.warn('claim 호출 실패 — 발송 계속 (누락 < 중복):', e.message);
            }
            let subscriptions = [];
            try {
              const res = await fetch(apiUrl, {
                headers: { Authorization: `Bearer ${process.env.ADMIN_TOKEN}` },
              });
              if (!res.ok) {
                console.error('Vercel API 응답 실패:', res.status, await res.text());
                process.exit(1);
              }
              const data = await res.json();
              subscriptions = Array.isArray(data.subscriptions) ? data.subscriptions : [];
            } catch (e) {
              console.error('Vercel API 호출 실패:', e.message);
              process.exit(1);
            }

            if (subscriptions.length === 0) {
              console.log('구독자 없음 — 발송 건너뜀 (정상 종료).');
              process.exit(0);
            }
            console.log(`구독자 ${subscriptions.length}명에게 발송 시도 (청크 ${CHUNK_SIZE}개)`);

            // 2. Worker pool 다중 발송 — 청크 단위 순차, 청크 내 동시
            const allResults = [];
            for (let i = 0; i < subscriptions.length; i += CHUNK_SIZE) {
              const chunk = subscriptions.slice(i, i + CHUNK_SIZE);
              const chunkResults = await Promise.allSettled(chunk.map(sub =>
                webpush.sendNotification(sub, payload, {
                  TTL: 86400, urgency: 'high', headers: { Urgency: 'high' },
                })
              ));
              allResults.push(...chunkResults);

              // 429 (Too Many Requests) 받았으면 Retry-After 헤더 존중
              const r429 = chunkResults.find(r => r.status === 'rejected' && r.reason?.statusCode === 429);
              if (r429) {
                const retryAfter = parseInt(r429.reason?.headers?.['retry-after'] || '1', 10);
                const waitMs = Math.min(retryAfter * 1000, MAX_RETRY_AFTER_MS);
                console.log(`청크 ${Math.floor(i / CHUNK_SIZE) + 1}: 429 응답. ${waitMs}ms 대기 후 다음 청크.`);
                await new Promise(r => setTimeout(r, waitMs));
              } else if (i + CHUNK_SIZE < subscriptions.length) {
                await new Promise(r => setTimeout(r, CHUNK_DELAY_MS));
              }
            }

            // 3. 결과 집계 + 404/410 stale endpoint 자동 정리 (recordId 일치 시만)
            let ok = 0, fail = 0;
            const stalePromises = [];
            for (let i = 0; i < allResults.length; i++) {
              const r = allResults[i];
              const sub = subscriptions[i];
              const host = (() => { try { return new URL(sub.endpoint).host; } catch (_) { return '?'; } })();
              if (r.status === 'fulfilled') {
                ok++;
                console.log(`OK [${host}] ${r.value.statusCode}`);
              } else {
                fail++;
                const code = r.reason?.statusCode;
                console.log(`FAIL [${host}] ${code} ${r.reason?.message || ''}`);
                // 404·410 stale 자동 정리 — recordId 함께 보내 race condition 차단
                if (code === 404 || code === 410) {
                  stalePromises.push(
                    fetch(apiUrl, {
                      method: 'DELETE',
                      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${process.env.ADMIN_TOKEN}` },
                      body: JSON.stringify({ endpoint: sub.endpoint, recordId: sub.recordId }),
                    }).then(res => {
                      if (res.ok) console.log(`stale 정리: ${host}`);
                      else if (res.status === 409) console.log(`stale 스킵 (record 갱신됨): ${host}`);
                      else console.warn(`stale 정리 실패: ${host} status=${res.status}`);
                    }).catch(e => console.warn(`stale 정리 네트워크 실패: ${host}`, e.message))
                  );
                }
              }
            }
            if (stalePromises.length) await Promise.allSettled(stalePromises);

            console.log(`==SUMMARY== 성공 ${ok} / 실패 ${fail} / 총 ${allResults.length}`);
            // 발송 1건이라도 성공하면 '오늘 발송 완료' 기록 → 다른 트리거(Vercel cron / schedule)가 중복 발송 안 함.
            // 0건이면 sent 기록 안 함 (lock은 2h 후 자동 만료되어 재시도 가능).
            if (ok > 0) {
              try {
                await fetch(`${claimUrl}?token=${encodeURIComponent(process.env.ADMIN_TOKEN)}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${process.env.ADMIN_TOKEN}` },
                  body: JSON.stringify({ date: today, phase: 'done' }),
                });
                console.log(`멱등성: ${today} 발송 완료 기록 (push:sent)`);
              } catch (e) { console.warn('claim done 기록 실패:', e.message); }
            }
            if (ok === 0 && fail > 0) process.exit(1);
          })().catch(e => { console.error('치명 에러:', e); process.exit(1); });
          EOF
