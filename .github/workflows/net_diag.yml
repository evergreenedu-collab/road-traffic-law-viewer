name: net-diag (임시 진단)

# law.go.kr API가 GitHub Actions(해외 IP)에서 http/https 접속되는지 진단.
# 자동 갱신(update.yml)이 5월부터 ConnectTimeout으로 실패하는 원인 규명용.
# 진단 후 제거 예정.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: law.go.kr HTTP(80) vs HTTPS(443) 접속 테스트
        run: |
          URL_PATH="/DRF/lawService.do?OC=evergreen_edu&target=law&type=XML&MST=281875"
          echo "===== DNS 조회 ====="
          nslookup www.law.go.kr || true
          echo ""
          echo "===== HTTP 80 ====="
          curl -s -m 40 -o /dev/null -w "code=%{http_code} time=%{time_total}s size=%{size_download}B\n" \
            "http://www.law.go.kr${URL_PATH}" && echo "HTTP 성공" || echo "HTTP 실패/타임아웃"
          echo ""
          echo "===== HTTPS 443 ====="
          curl -s -m 40 -o /dev/null -w "code=%{http_code} time=%{time_total}s size=%{size_download}B\n" \
            "https://www.law.go.kr${URL_PATH}" && echo "HTTPS 성공" || echo "HTTPS 실패/타임아웃"
