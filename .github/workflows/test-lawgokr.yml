name: test-lawgokr
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP 접속 테스트
        run: |
          echo "=== HTTP (port 80) ==="
          curl -sS -m 40 "http://www.law.go.kr/DRF/lawSearch.do?OC=evergreen_edu&target=law&query=%EB%8F%84%EB%A1%9C%EA%B5%90%ED%86%B5%EB%B2%95&type=XML" | head -c 400 && echo "" && echo "[HTTP OK]" || echo "[HTTP FAILED]"
      - name: HTTPS 접속 테스트
        run: |
          echo "=== HTTPS (port 443) ==="
          curl -sS -m 40 "https://www.law.go.kr/DRF/lawSearch.do?OC=evergreen_edu&target=law&query=%EB%8F%84%EB%A1%9C%EA%B5%90%ED%86%B5%EB%B2%95&type=XML" | head -c 400 && echo "" && echo "[HTTPS OK]" || echo "[HTTPS FAILED]"
